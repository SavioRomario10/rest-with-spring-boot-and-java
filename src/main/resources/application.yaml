spring:
  application:
    name: rest_spring_java
  datasource:
    url: jdbc:postgresql://localhost:5432/db_rest_spring
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  sql:
    init:
      mode: always

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    io.savioromario10: DEBUG